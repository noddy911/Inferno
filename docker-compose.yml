services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      # Reach MongoDB via the compose service name inside the network.
      MONGODB_URI: mongodb://mongodb:27017/interior-quotation
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo_data:
